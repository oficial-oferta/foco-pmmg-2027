name: Publicar Foco PMMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar somente frontend (nao publicar dados nem SQL)
        run: |
          mkdir -p _site/assets _site/data
          cp index.html styles.css app.js v2-premium.js official-exams.js config.js sw.js manifest.webmanifest _site/
          cp assets/icon.svg assets/sample-questions.json _site/assets/
          cp data/questions.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4