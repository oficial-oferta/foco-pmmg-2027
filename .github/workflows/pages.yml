name: Publicar Foco PMMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Auditar integridade do banco expandido (500 por matéria)
        run: node tools/audit_expansion_v3.cjs
      - name: Auditar as 2.500 questões após a revisão editorial V4
        run: node tools/audit_content_v4.cjs
      - name: Testar cronograma, alocação de horas, ofensiva e interface
        run: node tools/test_study_plan.cjs
      - name: Validar aba Revisões (5 matérias, fonologia e treino filtrado)
        run: node tools/test_reviews.cjs
      - name: Auditar catálogo de tópicos, novas questões e proporção do treino misto
        run: node tools/test_topic_catalog.cjs
      - name: Auditar 687 novas questões de Português e Matemática
        run: node tools/audit_50_topics_batch1.cjs
      - name: Preparar somente frontend (nao publicar dados nem SQL)
        run: |
          mkdir -p _site/assets _site/data
          cp index.html styles.css study-plan.css topic-catalog.css review-ui.css app.js v2-premium.js study-syllabus.js study-plan.js topic-catalog.js review-notes.js review-notes-pt-math.js review-notes-language-lit.js review-notes-law.js review-ui.js official-exams.js config.js sw.js manifest.webmanifest _site/
          cp assets/icon.svg assets/sample-questions.json _site/assets/
          cp data/questions.json data/reviewed-legacy-overrides.json data/topic-extras-v1.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4